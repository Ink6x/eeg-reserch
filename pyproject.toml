[project]
name = "eegdemo"
version = "0.1.0"
description = "把持動作 EEG イベント検出 — ポートフォリオ用解析プロジェクト (v1-v4 baseline) + eeg99 (v5+ competition-grade)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "pandas",
    "pyarrow",
    "pyyaml",
    "torch",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "unit: lightweight in-process unit tests",
    "integration: tests that touch IO / heavy compute",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# CHANNEL_POS_2D is aligned to mirror the scalp layout — keep rows intact
"src/eegdemo/constants.py" = ["E501"]
